[package]
name = "blaketime-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "blaketime_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = [ "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
blaketime-core = { path = "../../../packages/core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
tempfile.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
